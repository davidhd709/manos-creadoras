name: CI/CD – Manos Creadoras

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Tests del backend (pnpm + Prisma + NestJS)
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm prisma generate

      - name: Compilar
        run: pnpm run build

      - name: Tests
        run: pnpm run test

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Tests del frontend (npm + Vite)
  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build Docker → GHCR → Deploy al VPS
  #    Solo se ejecuta en push a main cuando los tests pasan
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Imagen del backend ──────────────────────────────────────────────────
      - name: Build y push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/manos-creadoras-backend:latest
            ghcr.io/${{ github.repository_owner }}/manos-creadoras-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Imagen del frontend ─────────────────────────────────────────────────
      - name: Build y push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/manos-creadoras-frontend:latest
            ghcr.io/${{ github.repository_owner }}/manos-creadoras-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy al VPS por SSH ───────────────────────────────────────────────
      - name: Deploy al VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_DEPLOY_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /home/ingenierohenry/manos-creadoras1

            # Actualizar archivos de configuración (docker-compose, nginx, etc.)
            git pull origin main

            # Autenticar en GHCR para poder bajar las imágenes privadas
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Bajar las nuevas imágenes del registry
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Reiniciar servicios con las imágenes nuevas (sin downtime en postgres)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Limpiar imágenes antiguas para liberar espacio
            docker image prune -f

            echo "Deploy completado - $(date)"
